<!DOCTYPE html>
<html lang="zh-Hant" data-theme="picturebook">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>北海道夏日家族旅行</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="">
<style>
/* ===== THEMES START（由 tools/sync-themes.mjs 從 assets/themes/themes.css 同步，不要直接改這段） ===== */
/* =========================================================
   trip-guide 風格系統（6 種）
   用法：<html data-theme="picturebook">，換風格只要改這個值
   picturebook 日系繪本｜tropical 熱帶活潑｜scrapbook 手帳剪貼簿
   boarding 復古登機證｜glass 液態玻璃｜magazine 雜誌編輯
   這份是母版：改完執行 node tools/sync-themes.mjs，
   會把內容同步進各版本 index.html 的 THEMES 區塊
   ========================================================= */

/* ---------- 共用變數（每種風格覆寫） ---------- */
:root{
  --bg:#FFFCF6; --paper:#FFFFFF; --ink:#3E3A39; --muted:#6B6563; --line:#E8DCCB;
  --c1:#F2A497; --c2:#F6D27A; --c3:#A8D3E6; --c4:#B9DAA5;
  --c1-ink:#9A3E2E; --c3-ink:#2F6F8C; --c4-ink:#3F6E2C;
  --on-c1:#3E3A39; --alert:#C8553D;
  --bw:3px; --bc:#3E3A39; --radius:22px; --radius-s:14px;
  --shadow:none; --shadow-lift:none;
  --font-body:"Huninn",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --font-head:var(--font-body);
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --hero-bg:var(--bg);
}

/* 🎨 日系繪本：和紙白、墨灰粗框、大圓角、平塗 */
[data-theme="picturebook"]{
  --alert:#C8553D;
  --bg:#FFFCF6; --paper:#FFFFFF; --ink:#3E3A39; --muted:#6B6563; --line:#E8DCCB;
  --c1:#F2A497; --c2:#F6D27A; --c3:#A8D3E6; --c4:#B9DAA5;
  --c1-ink:#9A3E2E; --c3-ink:#2F6F8C; --c4-ink:#3F6E2C; --on-c1:#3E3A39;
  --bw:3px; --bc:#3E3A39; --radius:22px; --radius-s:14px;
  --shadow:4px 4px 0 #3E3A39; --shadow-lift:6px 6px 0 #3E3A39;
  --font-body:"Huninn",-apple-system,"PingFang TC",sans-serif;
  --hero-bg:#FFF3D6;
}

/* 🌴 熱帶活潑：芒果橘、廟綠、辣椒紅（曼谷團原版） */
[data-theme="tropical"]{
  --alert:#E0452B;
  --bg:#FFF8EC; --paper:#FFFFFF; --ink:#2B1B0E; --muted:#7A6450; --line:#F1E3CC;
  --c1:#FF8A1F; --c2:#F5B700; --c3:#2F7DD1; --c4:#1F7A5C;
  --c1-ink:#A4520A; --c3-ink:#2F7DD1; --c4-ink:#1F7A5C; --on-c1:#FFFFFF;
  --bw:0px; --bc:transparent; --radius:18px; --radius-s:12px;
  --shadow:0 4px 14px rgba(120,70,10,.08); --shadow-lift:0 8px 22px rgba(120,70,10,.14);
  --font-body:"Chiron GoRound TC",-apple-system,"PingFang TC",sans-serif;
  --hero-bg:linear-gradient(135deg,#FF8A1F,#F5B700);
}

/* 📒 手帳剪貼簿：方格紙、紙膠帶、微歪的卡片 */
[data-theme="scrapbook"]{
  --alert:#B9503F;
  --bg:#F7F1E6; --paper:#FFFEFA; --ink:#4A3F35; --muted:#7D6E60; --line:#E6DACB;
  --c1:#E89A8B; --c2:#EBC868; --c3:#9CC3D5; --c4:#A9C79A;
  --c1-ink:#9C4A3B; --c3-ink:#3D6E85; --c4-ink:#4C6E3D; --on-c1:#4A3F35;
  --bw:1.5px; --bc:#CDBFAE; --radius:6px; --radius-s:6px;
  --shadow:0 2px 0 rgba(74,63,53,.08),0 6px 14px rgba(74,63,53,.10); --shadow-lift:0 10px 22px rgba(74,63,53,.16);
  --font-body:"LXGW WenKai TC",-apple-system,"PingFang TC",serif;
  --hero-bg:#F7F1E6;
}

/* 🎫 復古登機證：奶油紙、海軍藍、票根與打孔線 */
[data-theme="boarding"]{
  --alert:#C8553D;
  --bg:#F3EBDD; --paper:#FFFBF2; --ink:#1F2A44; --muted:#5E6577; --line:#D9CDB8;
  --c1:#C8553D; --c2:#E9B44C; --c3:#1F2A44; --c4:#4F7C6B;
  --c1-ink:#A23F2A; --c3-ink:#1F2A44; --c4-ink:#35594B; --on-c1:#FFFBF2;
  --bw:1.5px; --bc:#1F2A44; --radius:10px; --radius-s:8px;
  --shadow:0 1px 0 rgba(31,42,68,.12); --shadow-lift:0 6px 16px rgba(31,42,68,.14);
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
  --font-head:"Noto Serif TC","Songti TC",serif;
  --font-mono:"Space Mono",ui-monospace,Menlo,monospace;
  --hero-bg:#1F2A44;
}

/* 🫧 液態玻璃：半透明毛玻璃卡片，底下是風景照或漸層 */
[data-theme="glass"]{
  --alert:#D94A3A;
  --bg:#DCE7F2; --paper:rgba(255,255,255,.55); --ink:#14202E; --muted:#3E4E60; --line:rgba(20,32,46,.12);
  --c1:#3A7BD5; --c2:#F2B84B; --c3:#59B6C7; --c4:#6BBF8A;
  --c1-ink:#1E5BAE; --c3-ink:#1F6E7C; --c4-ink:#2D7A4C; --on-c1:#FFFFFF;
  --bw:1px; --bc:rgba(255,255,255,.7); --radius:26px; --radius-s:16px;
  --shadow:0 8px 30px rgba(20,32,46,.12),inset 0 1px 0 rgba(255,255,255,.8); --shadow-lift:0 14px 40px rgba(20,32,46,.18),inset 0 1px 0 rgba(255,255,255,.9);
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
  --hero-bg:transparent;
}

/* 📰 雜誌編輯：大字標題、細線、留白、黑白加一個重點色 */
[data-theme="magazine"]{
  --alert:#B5452E;
  --bg:#FAF8F4; --paper:#FFFFFF; --ink:#151515; --muted:#6A6A6A; --line:#DEDAD2;
  --c1:#B5452E; --c2:#C9A227; --c3:#2E5E7E; --c4:#5B7A4A;
  --c1-ink:#B5452E; --c3-ink:#2E5E7E; --c4-ink:#4C6A3C; --on-c1:#FFFFFF;
  --bw:1px; --bc:#151515; --radius:0px; --radius-s:0px;
  --shadow:none; --shadow-lift:none;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
  --font-head:"Noto Serif TC","Songti TC",serif;
  --hero-bg:#FAF8F4;
}

/* ---------- 共用元件（所有風格共用的骨架） ---------- */
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
h1,h2,h3,.head-font{font-family:var(--font-head)}
.card{background:var(--paper);border:var(--bw) solid var(--bc);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border-radius:var(--radius-s)}
.pill{border-radius:99px}
.mono{font-family:var(--font-mono)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor;line-height:1.5;vertical-align:2px}
.tag.walk{color:var(--c4-ink);background:color-mix(in srgb,var(--c4) 28%,var(--paper))}
.tag.train{color:var(--c3-ink);background:color-mix(in srgb,var(--c3) 28%,var(--paper))}
.tag.bus{color:#7A5A00;background:color-mix(in srgb,var(--c2) 35%,var(--paper))}
.tag.car{color:var(--c1-ink);background:color-mix(in srgb,var(--c1) 28%,var(--paper))}
.tag.flight{color:var(--ink);background:color-mix(in srgb,var(--line) 60%,var(--paper))}
.tag.must{color:var(--on-c1);background:var(--c1);border-color:var(--c1)}

/* 插圖：線條吃 --ink，填色吃 --c1～--c4，各風格自動變色 */
.ill .k{stroke:var(--ink);stroke-width:calc(var(--bw) + 1px);stroke-linejoin:round;stroke-linecap:round;fill:none}
.ill .f1{fill:var(--c1)} .ill .f2{fill:var(--c2)} .ill .f3{fill:var(--c3)} .ill .f4{fill:var(--c4)}
.ill .fp{fill:var(--paper)} .ill .fi{fill:var(--ink)}
[data-theme="tropical"] .ill .k,[data-theme="glass"] .ill .k{stroke-width:0}
[data-theme="magazine"] .ill .k{stroke-width:1.2px}
[data-theme="magazine"] .ill .f1,[data-theme="magazine"] .ill .f2,[data-theme="magazine"] .ill .f3,[data-theme="magazine"] .ill .f4{fill:none}
[data-theme="magazine"] .ill .sun{fill:var(--c1)}

/* 動畫：插圖輕輕動、切換日期彈一下 */
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes drift{50%{transform:translateX(10px)}}
@keyframes ride{0%{transform:translateX(-30px)}100%{transform:translateX(30px)}}
@keyframes twinkle{50%{opacity:.35}}
@keyframes boing{0%{transform:scale(.96) translateY(6px);opacity:.2}60%{transform:scale(1.02) translateY(-2px);opacity:1}100%{transform:none}}
.ill .bob{animation:bob 3.2s ease-in-out infinite}
.ill .drift{animation:drift 7s ease-in-out infinite}
.ill .ride{animation:ride 6s ease-in-out infinite alternate}
.ill .twinkle{animation:twinkle 2.4s ease-in-out infinite}
.boing{animation:boing .45s cubic-bezier(.3,1.4,.5,1)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

/* ---------- 各風格的裝飾 ---------- */

/* 🎨 繪本：硬陰影、粗框按鈕 */
[data-theme="picturebook"] .btn,[data-theme="picturebook"] .day-chip{border:var(--bw) solid var(--bc)}
[data-theme="picturebook"] .day-chip.on{box-shadow:3px 3px 0 var(--bc)}
[data-theme="picturebook"] .hero{border-bottom:var(--bw) solid var(--bc)}

/* 🌴 熱帶：漸層頁首、白字 */
[data-theme="tropical"] .hero{color:#fff;border-radius:0 0 28px 28px}
[data-theme="tropical"] .hero .sub,[data-theme="tropical"] .hero .stat span{color:rgba(255,255,255,.92)}
[data-theme="tropical"] .hero .stat b{color:#fff}
[data-theme="tropical"] .hero .kicker{color:rgba(255,255,255,.85)}
.hero .card{color:var(--ink)}

/* 📒 手帳：方格紙底、紙膠帶、卡片微歪 */
[data-theme="scrapbook"] body{background-image:linear-gradient(rgba(156,195,213,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(156,195,213,.18) 1px,transparent 1px);background-size:22px 22px}
[data-theme="scrapbook"] .card{position:relative}
[data-theme="scrapbook"] .card::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:20px;margin-left:-42px;background:color-mix(in srgb,var(--c2) 70%,transparent);transform:rotate(-3deg);opacity:.85}
[data-theme="scrapbook"] .card:nth-of-type(3n+2)::before{background:color-mix(in srgb,var(--c3) 70%,transparent);transform:rotate(2deg);left:22%}
[data-theme="scrapbook"] .card:nth-of-type(3n)::before{background:color-mix(in srgb,var(--c1) 60%,transparent);transform:rotate(-1deg);left:74%}
[data-theme="scrapbook"] .card:nth-of-type(odd){transform:rotate(-.4deg)}
[data-theme="scrapbook"] .card:nth-of-type(even){transform:rotate(.35deg)}
[data-theme="scrapbook"] .hero-art{background:var(--paper);padding:10px 10px 34px;box-shadow:var(--shadow-lift);transform:rotate(-1.5deg);border-radius:3px}

/* 🎫 登機證：深藍頁首、打孔線、等寬字 */
[data-theme="boarding"] .hero{color:#FFFBF2}
[data-theme="boarding"] .hero .sub,[data-theme="boarding"] .hero .stat span{color:#E9DFC9}
[data-theme="boarding"] .hero .stat b{color:var(--c2);font-family:var(--font-mono)}
[data-theme="boarding"] .hero .kicker{color:var(--c2);font-family:var(--font-mono)}
[data-theme="boarding"] .hero-art{background:#FFFBF2;border-radius:10px;padding:8px;position:relative}
[data-theme="boarding"] .card{position:relative}
[data-theme="boarding"] .card.ticket{border-style:solid;background:radial-gradient(circle at 0 50%,transparent 11px,var(--paper) 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,var(--paper) 12px) right/51% 100% no-repeat;border:0;box-shadow:0 0 0 1.5px var(--bc) inset}
[data-theme="boarding"] .perf{border-top:2px dashed var(--line);margin:12px -16px}
[data-theme="boarding"] .day-chip b,[data-theme="boarding"] .t{font-family:var(--font-mono)}
[data-theme="boarding"] .stamp{display:inline-block;border:2px solid var(--c1);color:var(--c1);border-radius:8px;padding:2px 10px;transform:rotate(-6deg);font-family:var(--font-mono);font-weight:700;letter-spacing:1px}

/* 🫧 玻璃：背景照片／漸層＋毛玻璃 */
[data-theme="glass"] body{background:var(--photo,radial-gradient(1200px 600px at 10% -10%,#FFD9A8 0,transparent 60%),radial-gradient(900px 700px at 110% 10%,#A9D8F5 0,transparent 55%),radial-gradient(900px 900px at 50% 110%,#BDE8C9 0,transparent 60%),#DCE7F2);background-attachment:fixed;background-size:cover}
[data-theme="glass"] .card,[data-theme="glass"] .topbar,[data-theme="glass"] .day-chip,[data-theme="glass"] nav.tabs{-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}
[data-theme="glass"] .topbar,[data-theme="glass"] nav.tabs{background:rgba(255,255,255,.55) !important}
[data-theme="glass"] .day-chip{background:rgba(255,255,255,.45) !important;border:1px solid rgba(255,255,255,.7) !important}
[data-theme="glass"] .hero-art{border-radius:26px;overflow:hidden;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  [data-theme="glass"]{--paper:rgba(255,255,255,.92)}
}

/* 📰 雜誌：大標、細線分隔、沒有圓角 */
[data-theme="magazine"] .card{border-width:0;border-top:1px solid var(--bc);background:transparent;padding-left:0;padding-right:0}
[data-theme="magazine"] .hero h1{font-size:40px;line-height:1.15;font-weight:900;letter-spacing:-.5px}
[data-theme="magazine"] .hero .kicker{letter-spacing:3px;text-transform:uppercase;color:var(--c1)}
[data-theme="magazine"] h2{font-size:26px;font-weight:900;border-bottom:3px solid var(--ink);padding-bottom:6px}
[data-theme="magazine"] .day-chip{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent}
[data-theme="magazine"] .day-chip.on{border-bottom-color:var(--c1);background:transparent;color:var(--ink)}
[data-theme="magazine"] .btn{border:1px solid var(--ink)}
/* ===== THEMES END ===== */

/* ===== 團體版版面（顏色一律用風格變數，換風格不用改這裡） ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-size:17px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
[hidden]{display:none !important}

/* 頂端標題列 */
.topbar{position:sticky;top:0;z-index:25;background:var(--paper);border-bottom:var(--bw) solid var(--bc);padding-top:env(safe-area-inset-top)}
[data-theme="tropical"] .topbar,[data-theme="glass"] .topbar{border-bottom:1px solid var(--line)}
.topbar .in{max-width:560px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.topbar b{font-family:var(--font-head);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tz{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* 首頁主視覺 */
.hero{margin:14px 0 4px;padding:0;background:none}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art{border-radius:var(--radius);overflow:hidden;border:var(--bw) solid var(--bc)}
[data-theme="tropical"] .hero-art{border:0}
.kicker{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-top:12px}
.hero h1{margin:2px 0 2px;font-size:28px;line-height:1.25}
.hero .sub{margin:0;color:var(--muted);font-size:15px}
[data-theme="tropical"] .hero,[data-theme="boarding"] .hero{color:var(--ink)}
[data-theme="tropical"] .hero .kicker,[data-theme="boarding"] .hero .kicker{color:var(--c1-ink)}
[data-theme="tropical"] .hero .stat b,[data-theme="boarding"] .hero .stat b{color:var(--c1-ink)}
[data-theme="tropical"] .hero .stat span,[data-theme="boarding"] .hero .stat span,[data-theme="tropical"] .hero .sub,[data-theme="boarding"] .hero .sub{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0}
.stat{text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1;color:var(--c1-ink);font-family:var(--font-head)}
.stat span{font-size:12.5px;color:var(--muted)}

h2{font-size:20px;margin:26px 0 10px;line-height:1.35}
h3{font-size:17px;margin:0 0 6px}
.card{padding:16px;margin:12px 0}
.muted{color:var(--muted);font-size:14px}
.soft-bg{background:color-mix(in srgb,var(--c2) 22%,var(--paper))}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;vertical-align:2px}
.pill.meet{background:var(--alert);color:#fff}
.pill.now{background:var(--c4-ink);color:#fff}
.pill.soft{background:color-mix(in srgb,var(--c2) 35%,var(--paper));color:var(--ink)}
.pill.cost{background:color-mix(in srgb,var(--c4) 30%,var(--paper));color:var(--c4-ink)}
.pill.cost-est{background:color-mix(in srgb,var(--c2) 35%,var(--paper));color:var(--ink)}
.pill.grp{color:#fff}
.pill.grp-back{background:color-mix(in srgb,var(--c3) 30%,var(--paper));color:var(--c3-ink)}

/* 首頁狀態 */
.big{font-size:40px;font-weight:800;line-height:1.1;color:var(--c1-ink);font-family:var(--font-head)}
.next{border-color:var(--alert) !important;border-width:max(var(--bw),3px) !important;border-style:solid !important}
.next .time{font-size:44px;font-weight:800;color:var(--alert);line-height:1;font-family:var(--font-head)}
.next .left{font-weight:700;color:var(--alert);margin-top:6px}

/* 按鈕 */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);padding:10px 14px;font:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;background:var(--paper);color:var(--ink);min-height:44px}
.btn.main{background:var(--c4-ink);border-color:var(--c4-ink);color:#fff}
.btn.orange{background:var(--c1);border-color:var(--c1);color:var(--on-c1)}
.btn.call{background:color-mix(in srgb,var(--c3) 25%,var(--paper));color:var(--c3-ink)}
.btn.add{background:color-mix(in srgb,var(--c2) 30%,var(--paper))}
.btn:disabled{opacity:.45;cursor:default}
.big-btn{width:100%;justify-content:center;font-size:17px;min-height:52px}

/* 航班 */
.fl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fl-h b{font-size:17px}
.fl-route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:12px 0 8px}
.fl-code{font-size:26px;font-weight:800;letter-spacing:1px;font-family:var(--font-mono)}
.fl-time{font-size:22px;font-weight:800;color:var(--c1-ink);line-height:1.1}
.fl-sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.fl-mid{text-align:center;font-size:22px;color:var(--muted)}
.fl-mid small{display:block;font-size:11.5px;white-space:nowrap}
.fl-foot{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* 日期切換＋時間軸 */
.days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px;scrollbar-width:none;position:sticky;top:calc(44px + env(safe-area-inset-top));background:var(--bg);z-index:5}
[data-theme="glass"] .days{background:transparent}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--radius-s);padding:6px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);min-width:74px}
.day-chip b{display:block;font-size:16px}
.day-chip span{font-size:12px;color:var(--muted)}
.day-chip.on{background:var(--c2);color:var(--ink)}
[data-theme="tropical"] .day-chip.on{background:var(--c1);border-color:var(--c1);color:#fff}
[data-theme="tropical"] .day-chip.on span{color:#fff}
[data-theme="boarding"] .day-chip.on{background:var(--c3);color:#FFFBF2}
[data-theme="boarding"] .day-chip.on span{color:#E9DFC9}
.day-chip.today{outline:2px dashed var(--c4-ink);outline-offset:2px}
.day-title{font-size:20px;font-weight:800;margin:12px 0 2px;font-family:var(--font-head)}
.day-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin:4px 0 6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.filters button{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink);min-height:36px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl{position:relative;margin:10px 0 0;padding-left:0;list-style:none}
.item{display:grid;grid-template-columns:58px 1fr;gap:10px;margin-bottom:10px}
.item.hide{display:none}
.item .t{text-align:right;font-weight:800;font-size:15.5px;padding-top:14px;color:var(--c1-ink)}
.item .t small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.item details{background:var(--paper);border:var(--bw) solid var(--bc);border-radius:var(--radius-s);box-shadow:var(--shadow);border-left:6px solid var(--c2)}
[data-theme="glass"] .item details{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.item.meet details{border-left-color:var(--alert)}
.item.nowon details{outline:3px solid var(--c4-ink)}
.item.past{opacity:.55}
.item summary{list-style:none;padding:12px 14px;cursor:pointer;font-weight:700;font-size:16.5px;display:flex;gap:8px;align-items:flex-start}
.item summary::-webkit-details-marker{display:none}
.item summary .arrow{margin-left:auto;color:var(--muted);transition:transform .2s;flex:0 0 auto}
.item details[open] .arrow{transform:rotate(90deg)}
.item .body{padding:0 14px 14px;font-size:15.5px}
.item .body p{margin:6px 0}
.item .tags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.route{background:color-mix(in srgb,var(--c4) 22%,var(--paper));border-radius:var(--radius-s);padding:10px 12px;margin:8px 0;font-size:15px}
.route b{color:var(--c4-ink)}
.tip{background:color-mix(in srgb,var(--c2) 24%,var(--paper));border-radius:var(--radius-s);padding:10px 12px;margin:8px 0;font-size:15px}
.tipbox{background:color-mix(in srgb,var(--c2) 26%,var(--paper));border-radius:var(--radius-s);padding:12px 14px;margin:12px 0;font-size:15px;border:1.5px dashed color-mix(in srgb,var(--c2) 80%,var(--ink))}
.daynav{display:flex;justify-content:space-between;gap:8px;margin:10px 0}
.sec{margin:14px 0 4px}
.sec-h{color:#fff;font-weight:800;font-size:16px;border-radius:var(--radius-s);padding:10px 14px;margin-bottom:10px}
.sec-h small{display:block;font-weight:500;font-size:13px;opacity:.92;margin-top:2px}
.sec-h.all{background:var(--c4-ink)}
.sec .pill.grp{display:none}
.grprow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:15px}
.dress-day{background:var(--paper);border-radius:var(--radius-s);padding:12px 14px;margin:10px 0;border:2px dashed color-mix(in srgb,var(--c1) 60%,var(--paper))}
.dress-label{display:block;font-size:13px;font-weight:800;color:var(--c1-ink);margin-bottom:4px}
.dress-groups{display:grid;gap:6px;margin-top:8px}
.dg{display:flex;align-items:center;gap:8px;font-size:15px}
.dg .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
.dress + .dress{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}

/* 天氣 */
.wx{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--c3) 24%,var(--paper));border-radius:var(--radius-s);padding:14px;margin:12px 0 4px}
.wx-ico{font-size:44px;line-height:1}
.wx-main{flex:1;min-width:0}
.wx-place{font-size:13px;font-weight:800;color:var(--c3-ink)}
.wx-txt{font-size:19px;font-weight:800}
.wx-t{margin-left:10px;color:var(--c1-ink)}
.wx-tip{font-size:14px;font-weight:700;margin-top:4px}
.wx-upd{font-size:12px;color:var(--muted);margin-top:6px}
.wx-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:4px;text-align:center}
.wxs{display:flex;flex-direction:column;font-size:14px}
.wxs-i{font-size:26px;line-height:1.3}

/* 住宿／聯絡 */
.local{font-size:22px;line-height:1.5;font-weight:700;background:color-mix(in srgb,var(--c2) 18%,var(--paper));border:2px dashed var(--c2);border-radius:var(--radius-s);padding:14px;margin:10px 0;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.contact{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact .who{flex:1;min-width:0}
.contact .who b{display:block}
.van{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.van span{background:color-mix(in srgb,var(--c2) 30%,var(--paper));padding:4px 10px;border-radius:99px;font-size:15px}
.van .empty{background:none;color:var(--muted);padding-left:0}
ul.dots{margin:6px 0;padding-left:20px}
ul.dots li{margin:4px 0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border-bottom:0}
.tf{display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--c4) 14%,var(--paper));border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tf span{display:block;font-size:12px;color:var(--muted)}
.copy{border:0;background:var(--paper);border-radius:10px;width:44px;height:40px;font-size:18px;cursor:pointer;flex:0 0 auto;box-shadow:var(--shadow)}
.warn-soft{background:color-mix(in srgb,var(--alert) 10%,var(--paper)) !important}
.ok-soft{background:color-mix(in srgb,var(--c4) 20%,var(--paper)) !important;font-weight:700;color:var(--c4-ink)}
.room-h{display:flex;justify-content:space-between;align-items:center}
.room-h b{font-size:18px}
.room-n{font-weight:800;color:var(--muted)}
.room-n.good{color:var(--c4-ink)}
.room-n.bad{color:var(--alert)}
.room.over{border-color:var(--alert) !important}
.chips button .elsewhere{font-size:11px;opacity:.75;margin-left:2px}

/* 清單 */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:24px;height:24px;accent-color:var(--c4-ink);flex:0 0 auto;margin-top:2px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--c4-ink);transition:width .3s}
.booking{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.booking:last-child{border-bottom:0}
.booking .ico{font-size:24px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.step .no{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--c3);color:var(--ink);border:var(--bw) solid var(--bc)}
[data-theme="tropical"] .step .no,[data-theme="glass"] .step .no,[data-theme="boarding"] .step .no{color:#fff}
.step p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.fees{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fee{padding:12px;text-align:center;margin:0}
.fee b{display:block;font-size:22px;color:var(--c1-ink);font-family:var(--font-head)}
.fee span{font-size:13px;color:var(--muted)}
.phrase{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase b{display:block;font-size:15px}
.phrase .lo{display:block;font-size:21px;font-weight:700;line-height:1.4}
.phrase .say{display:block;color:var(--muted);font-size:14px}
.play{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:0;background:color-mix(in srgb,var(--c2) 35%,var(--paper));font-size:22px;cursor:pointer}
.play.on{background:var(--c2);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.conv label{font-size:13px;color:var(--muted);display:block}
.conv input{width:100%;font-size:22px;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.conv .eq{font-size:22px;padding-top:16px}
.rate{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rate input{width:80px;font-size:15px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}

/* 收合卡片 */
.jj > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.jj > summary::-webkit-details-marker{display:none}
.jj-hint{display:block;font-size:13px;font-weight:400}
.jj .arrow,.sub .arrow{color:var(--muted);transition:transform .2s}
.jj[open] > summary > .arrow,.sub[open] > summary > .arrow{transform:rotate(90deg)}
.sub{border-top:1px dashed var(--line);margin-top:10px}
.sub > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;padding:12px 0 2px}
.sub > summary::-webkit-details-marker{display:none}
.sub-b{padding:6px 0 4px}

/* 記帳 */
.money{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.est{font-size:15px;margin-bottom:6px}
.exp{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.exp .x{border:0;background:color-mix(in srgb,var(--alert) 14%,var(--paper));color:var(--alert);border-radius:50%;width:32px;height:32px;flex:0 0 auto;cursor:pointer}
.daymoney{border-color:var(--c2) !important;border-width:2px !important}
.dm-h{font-weight:800;margin-bottom:4px}
.dm-row{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:2px 0}
.dm-row b{color:var(--c1-ink)}
.sheet{position:fixed;inset:0;background:rgba(30,25,20,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));position:relative}
[data-theme="glass"] .sheet-in{background:#F2F6FA}
.sheet-x{position:absolute;right:12px;top:12px;border:0;background:var(--paper);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.f-l{display:block;font-weight:800;font-size:15px;margin:14px 0 4px}
.amt{display:flex;gap:8px;align-items:center}
.amt .m-in{font-size:22px;font-weight:800;flex:1;min-width:0}
.seg{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:12px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:none;padding:10px 10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--c1);color:var(--on-c1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips button{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:40px;color:var(--ink)}
.chips button.on{background:var(--c4-ink);border-color:var(--c4-ink);color:#fff}
.chips button.fund{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 25%,var(--paper));font-weight:800}
.chips button.fund.on{background:var(--c2);border-color:var(--c2);color:var(--ink)}
.fundcard{border-color:var(--c2) !important;border-width:2px !important}
.fund-bar{height:12px;margin:8px 0 6px}
.fund-list{margin-top:10px;border-top:1px dashed var(--line)}
.person{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr;gap:4px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:right}
.person > :first-child{text-align:left}
.person.head{color:var(--muted);font-size:12px}
.person .pos{color:var(--c4-ink);font-weight:800}
.person .neg{color:var(--alert);font-weight:800}
.mv{border-bottom:1px solid var(--line)}
.mv > summary{list-style:none;cursor:pointer;display:flex;gap:6px;align-items:center;padding:8px 0;font-size:16px}
.mv > summary::-webkit-details-marker{display:none}
.mv > summary .amt{margin-left:auto;font-weight:800}
.mv > summary .arrow{color:var(--muted);transition:transform .2s}
.mv[open] > summary .arrow{transform:rotate(90deg)}
.paidbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.paidbtn.on{background:color-mix(in srgb,var(--c4) 25%,var(--paper));border-color:var(--c4-ink);color:var(--c4-ink)}
.paidbtn.warn{background:color-mix(in srgb,var(--c2) 35%,var(--paper));border-color:var(--c2);color:var(--ink)}
.mv.done > summary b,.mv.done > summary .amt{opacity:.55}
.mv-b{padding:2px 0 10px;font-size:14px}
.mv-h{display:flex;justify-content:space-between;font-weight:800;margin:8px 0 2px;padding-top:6px;border-top:1px dashed var(--line)}
.mv-h:first-child{border-top:0;margin-top:0}
.mv-r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mv-r small{color:var(--muted)}
.mv-r .n{white-space:nowrap}
.where-row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.where-row select{font-size:15px;padding:10px 8px}
.exp-row{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.btn.del-btn{background:color-mix(in srgb,var(--alert) 12%,var(--paper));color:var(--alert);width:100%;justify-content:center}

/* 推薦 */
.warn-card{border-color:var(--alert) !important;background:color-mix(in srgb,var(--alert) 7%,var(--paper)) !important}
.warn-card h3{color:var(--alert)}
.rcat{padding:6px 14px;margin:10px 0}
.rcat > summary b{font-size:17px}
.rtop{display:block;font-size:13px;font-weight:500;color:var(--c1-ink)}
.rcat .sub-b > .card,.side .sub-b > .card{box-shadow:none;margin:8px 0}
.stiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stile{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper));border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.stile b{display:block;font-size:14px}
.stile span{font-size:12.5px;color:var(--muted)}
.stile.on{background:var(--c);color:#fff}
.stile.on span{color:#fff}
.btn.wishbtn.on{background:var(--c1);color:var(--on-c1)}
.filter-note{font-size:14px;font-weight:700;color:var(--c1-ink);margin:8px 0 0}
.rec-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rec-n{font-size:18px;display:block}
.rec-en{font-size:13px;color:var(--muted)}
.heart,.edit-btn{border:0;background:color-mix(in srgb,var(--c1) 18%,var(--paper));color:var(--c1-ink);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;flex:0 0 auto}
.heart.on{background:var(--c1);color:var(--on-c1)}
.rec-btns{display:flex;gap:6px;flex:0 0 auto}
.rec-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.rec-by{font-size:13px;color:var(--muted)}
.like{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:40px;color:var(--ink)}
.like.on{background:var(--c3-ink);border-color:var(--c3-ink);color:#fff}
.rec-warn{background:color-mix(in srgb,var(--alert) 10%,var(--paper));color:var(--alert);border-radius:10px;padding:6px 10px;font-size:14px;margin:6px 0}
.shops{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.shop{border:0;background:color-mix(in srgb,var(--c4) 22%,var(--paper));color:var(--c4-ink);border-radius:99px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;text-decoration:none}
button.shop{cursor:pointer}
.vids{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.vid{flex:0 0 82%;max-width:330px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px}
.vid iframe{width:100%;height:520px;border:0;border-radius:12px;background:var(--paper)}

/* 留言板 */
.m-in{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin:4px 0}
[data-theme="glass"] .m-in{background:#fff}
.m-in:focus{outline:none;border-color:var(--c1)}
.msg{display:flex;gap:12px;padding:14px}
.ava{flex:0 0 auto;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
.mbody{flex:1;min-width:0}
.mtext{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.m-del{border:0;background:color-mix(in srgb,var(--alert) 12%,var(--paper));color:var(--alert);border-radius:8px;padding:2px 8px;font-size:13px;cursor:pointer;float:right}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:28px 0 8px}
.demo-bar{background:var(--c3-ink);color:#fff;font-size:13px;text-align:center;padding:6px 12px}

/* 底部分頁列 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:var(--bw) solid var(--bc);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
[data-theme="tropical"] nav.tabs,[data-theme="glass"] nav.tabs{border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.05)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 0 10px;font:inherit;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:60px}
nav.tabs button .i{font-size:20px;line-height:1.2;filter:grayscale(.6)}
nav.tabs button.on{color:var(--ink);font-weight:800}
nav.tabs button.on .i{filter:none;transform:scale(1.1)}
section.page{display:none}
section.page.on{display:block}

/* 風格切換列（預覽用） */
.switcher{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;gap:4px;background:var(--paper);border:1.5px solid var(--bc);border-radius:99px;padding:5px;box-shadow:var(--shadow-lift);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.switcher button{border:0;background:none;border-radius:99px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
.switcher button.on{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden>示範模式：這是範例資料，你按的任何東西都不會真的存起來</div>
<header class="topbar"><div class="in"><b id="top-title"></b><span class="tz" id="clock"></span></div></header>

<main class="wrap">
  <section class="page on" id="p-home"></section>
  <section class="page" id="p-plan"></section>

const DEMO = true; // 預覽站：一律用示範資料
const demoDB = JSON.parse(JSON.stringify(DEMO_SEED));
async function api(path, opt = {}){
  if (!DEMO){
    const r = await fetch(path, { cache:"no-store", ...opt, headers:{ "Content-Type":"application/json", ...(opt.headers || {}) } });
    if (!r.ok) throw r.status;
    return r.json();
  }
  const u = new URL(path, location.href), id = +u.searchParams.get("id"), m = opt.method || "GET", body = opt.body ? JSON.parse(opt.body) : {};
  const nextId = list => Math.max(0, ...list.map(x => x.id)) + 1;
  const table = { "/api/expenses":"expenses", "/api/recs":"recs", "/api/messages":"messages" }[u.pathname];
  if (table){
    const list = demoDB[table];
    if (m === "POST") list.push({ ...body, id: nextId(list), currency: body.currency === "TWD" ? "TWD" : "LOC", likes:0, liked:0, created_at: Date.now() });
    if (m === "PUT") Object.assign(list.find(x => x.id === id) || {}, body);
    if (m === "DELETE") demoDB[table] = list.filter(x => x.id !== id);
    return JSON.parse(JSON.stringify(table === "messages" ? [...demoDB[table]].reverse() : demoDB[table]));
  }
  if (u.pathname === "/api/rooms"){
    if (m === "POST"){ demoDB.rooms = demoDB.rooms.filter(a => a.room !== body.room && !body.names.includes(a.name)).concat(body.names.map(name => ({ name, room: body.room }))); }
    return JSON.parse(JSON.stringify(demoDB.rooms));
  }
  if (u.pathname === "/api/settle"){
    if (m === "POST") demoDB.paid = body.paid ? demoDB.paid.filter(p => p.name !== body.name).concat({ ...body, paid_at: Date.now() }) : demoDB.paid.filter(p => p.name !== body.name);
    return JSON.parse(JSON.stringify(demoDB.paid));
  }
  if (u.pathname === "/api/likes"){
    const r = demoDB.recs.find(x => x.id === body.rec); r.liked = r.liked ? 0 : 1; r.likes = (r.likes || 0) + (r.liked ? 1 : -1);
    return { likes: r.likes, liked: !!r.liked };
  }
  return [];
}

/* ---------- 時間（全部用當地時間） ---------- */
function localNow(){
  const q = new URLSearchParams(location.search).get("now"); // 測試用：?now=2027-07-17T09:00
  if (q){ const [d, t = "00:00"] = q.split("T"); return stamp(d, t); }
  return Date.now() + TRIP.utc * 3600 * 1000;
}
function stamp(date, hm){
  const [y, m, d] = date.split("-").map(Number), [h, mi] = hm.split(":").map(Number);
  return Date.UTC(y, m - 1, d, h, mi);
}
const isTime = s => /^\d\d:\d\d$/.test(s);
const todayStr = () => new Date(localNow()).toISOString().slice(0, 10);
const hmNow = () => new Date(localNow()).toISOString().slice(11, 16);
const mdw = day => `${+day.date.slice(5, 7)}/${+day.date.slice(8, 10)}（${day.w}）`;
function fmtLeft(ms){
  const m = Math.round(ms / 60000);
  if (m < 1) return "就是現在！";
  if (m < 60) return `還有 ${m} 分鐘`;
  const h = Math.floor(m / 60), r = m % 60;
  return `還有 ${h} 小時${r ? " " + r + " 分" : ""}`;
}
function allItems(){
  return DAYS.flatMap((d, di) => d.items.map(it => ({ ...it, di, day: d,
    s: isTime(it.t) ? stamp(d.date, it.t) : null, en: it.e ? stamp(d.date, it.e) : null })));
}
function statusOf(it, now){
  if (it.s == null) return "";
  const end = it.en ?? it.s + 30 * 60000;
  if (now >= end) return "past";
  if (now >= it.s) return "nowon";
  return "";
}

let planCat = "all";
function itemHTML(it, now, openIt, di){
  const st = statusOf(it, now);
  const time = isTime(it.t) ? `${it.t}${it.e ? `<small>– ${it.e}</small>` : ""}` : `<span style="font-size:14px">${esc(it.t)}</span>`;
  const badge = st === "nowon" ? `<span class="pill now">進行中</span>` : it.meet ? `<span class="pill meet">集合</span>` : "";
  const ex = expOf(di, it.k);
  const hide = planCat !== "all" && it.cat !== planCat ? " hide" : "";
  return `<li class="item ${it.meet ? "meet" : ""} ${st}${hide}">
    <div class="t">${time}</div>
    <details data-key="${di}-${it.k}" ${openIt ? "open" : ""}><summary><span>${groupPill(it.group)} ${it.title} ${badge}${ex.length ? ` <span class="pill cost">💰 ${sumLabel(ex)}</span>` : it.cost ? ` <span class="pill cost-est">約 ${fmtLOC(it.cost)}/人</span>` : ""}</span><span class="arrow">›</span></summary>

    </details></li>`;

function timelineHTML(di, items, now, isOpen){
  vegOpenKeys = new Set([...document.querySelectorAll("details.veg[open]")].map(x => x.dataset.vk));
  const li = (it, i) => itemHTML(it, now, isOpen(it, i), di);
  const gs = DAYS[di].groups;
  if (!gs) return `<ul class="tl">${items.map(li).join("")}</ul>`;
  const idx = items.map((it, i) => [it, i]);
  const gi = idx.filter(([it]) => it.group).map(([, i]) => i);
  const firstG = Math.min(...gi), lastG = Math.max(...gi);
  const sec = (head, list) => list.length ? `<div class="sec">${head}<ul class="tl">${list.map(([it, i]) => li(it, i)).join("")}</ul></div>` : "";
  const onlyOf = idx.filter(([it]) => it.only);
  return sec(`<div class="sec-h all">🤝 全員</div>`, idx.filter(([it, i]) => !it.group && !it.only && i < firstG))
    + gs.map(g => sec(`<div class="sec-h" style="background:${GROUPS[g].color}">${GROUPS[g].name}<small>${GROUPS[g].members.join("、")}</small></div>`, idx.filter(([it]) => it.group === g))).join("")
    + sec(`<div class="sec-h all">🤝 全員會合</div>`, idx.filter(([it, i]) => !it.group && !it.only && i > lastG))
    + sec(onlyOf.length ? `<div class="sec-h all">👥 部分成員<small>${onlyOf[0][0].only.join("、")}</small></div>` : "", onlyOf);
}

function renderHome(){
  const now = localNow(), today = todayStr(), start = stamp(TRIP.start, "00:00"), items = allItems();
  const di = DAYS.findIndex(d => d.date === today);
  let html = heroHTML();
  if (now < start){
    const days = Math.ceil((start - now) / 86400000);
    html += `<div class="card"><div class="muted">距離出發還有</div><div class="big">${days} 天 🧳</div>
      <p style="margin:6px 0 0">${esc(TRIP.intro)}</p>
      <div class="btns"><button class="btn orange" data-prep>🛂 出發前準備</button><button class="btn" data-go="list">✅ 行前清單</button><button class="btn main" data-go="plan">🗓️ 完整行程</button></div></div>${weatherStrip()}`;
  } else if (di === -1){
    html += `<div class="card"><div class="big">旅程結束 🎉</div><p>謝謝大家，一起創造好多回憶！照片記得上傳到群組相簿～</p></div>`;
  } else {
    const d = DAYS[di];
    const upcoming = items.filter(it => it.meet && it.s != null && it.s + 5 * 60000 > now);
    const shared = upcoming.findIndex(it => !it.group);
    const before = shared < 0 ? upcoming : upcoming.slice(0, shared);
    const seen = new Set(), nexts = [];
    for (const it of before) if (it.group && !seen.has(it.group)){ seen.add(it.group); nexts.push(it); }
    if (nexts.length && shared >= 0) nexts.push(upcoming[shared]);
    if (!nexts.length && upcoming[0]) nexts.push(upcoming[0]);
    const cur = items.filter(it => it.di === di && statusOf(it, now) === "nowon").pop();
    html += `<div class="card"><span class="pill soft">Day ${di + 1}・${mdw(d)}</span>
      <h3 style="margin-top:8px;font-size:19px">${d.title}</h3>${cur ? `<p style="margin:4px 0 0">現在：<b>${cur.title}</b></p>` : ""}</div>${weatherHTML(di)}${todayDress(di)}`;
    for (const next of nexts){
      html += `<div class="card next"><div class="muted">⏰ ${next.group ? GROUPS[next.group].name + " 的下一個集合" : nexts.length > 1 ? "下一次全員集合" : "下一個集合"}</div>
        <div class="time">${next.di === di ? "" : `<span style="font-size:18px">Day ${next.di + 1} ${mdw(next.day)}</span><br>`}${next.t}</div>
        <div class="left">${fmtLeft(next.s - now)}</div>
        <p style="margin:8px 0 0;font-size:18px">${groupPill(next.group)} <b>${next.title}</b></p>
        <p style="margin:2px 0 0">📌 ${next.where || "詳見行程"}</p>
        <div class="btns">${mapBtn(next.place)}<button class="btn main" data-go="plan" data-day="${next.di}">看細節</button></div></div>`;
    }
    html += `<h2>今天的行程</h2>${timelineHTML(di, d.items.map(it => ({ ...it, s: isTime(it.t) ? stamp(d.date, it.t) : null, en: it.e ? stamp(d.date, it.e) : null })), now, () => false)}`;
  }
  html += flightsHTML();
  html += `<div class="card"><h3>📲 加到手機桌面，像 App 一樣一點就開</h3>
    <p class="muted" style="margin:0"><b>iPhone：</b>Safari 下方「分享」→「加入主畫面」<br><b>Android：</b>Chrome 右上「⋮」→「加到主畫面」</p></div>`;
  $("#p-home").innerHTML = html;
}

let planDay = null, planAnim = false;

  const t0 = DAYS.findIndex(x => x.date === today), rot = t0 > 0 ? t0 : 0;

    + `<option value="-1" ${sel === -1 ? "selected" : ""}>其他花費</option>`;

async function saveExpense(){
  const title = $("#x-title").value.trim(), amount = parseFloat($("#x-amt").value), tip = $("#x-tip");
  if (!title) return tip.textContent = "請填項目名稱";
  if (!(amount > 0)) return tip.textContent = "請填金額";
  if (!draft.payer) return tip.textContent = "請選誰先付的";
  if (!draft.split.length) return tip.textContent = "請至少選 1 個分帳的人";
  const btn = $("#x-save"); btn.disabled = true; tip.textContent = "儲存中…";
  try {
    await api("/api/expenses" + (draft.id ? "?id=" + draft.id : ""), { method: draft.id ? "PUT" : "POST", body: JSON.stringify({ ...draft, title, amount }) });
    if (draft.payer !== FUND) store.set("payer", draft.payer);
    closeSheet(); expSig = ""; await loadExpenses();

async function deleteExpense(id){

  try { await api("/api/expenses?id=" + id, { method:"DELETE" }); } catch(err){}

}
// 💸 結算：所有人只跟結算人對一次帳
// 每人最終 ＝ 繳的公積金 − 應分攤的全部花費 ＋ 自己墊的錢；正數＝結算人退給他、負數＝他補給結算人
function settlement(){
  const bal = Object.fromEntries(MEMBERS.map(m => [m, { paid:0, share:0 }]));
  for (const e of EXP){
    const v = toTWD(e);
    if (e.payer !== FUND) (bal[e.payer] ||= { paid:0, share:0 }).paid += v;
    for (const m of e.split) (bal[m] ||= { paid:0, share:0 }).share += v / e.split.length;
  }
  const net = {}, moves = [];
  for (const m of MEMBERS){
    net[m] = FUND_PER_PERSON - bal[m].share + bal[m].paid;
    const x = Math.round(net[m]);
    if (m === SETTLER || Math.abs(x) < 1) continue;
    moves.push(x > 0 ? [SETTLER, m, x] : [m, SETTLER, -x]);
  }
  moves.sort((p, q) => q[2] - p[2]);
  return { bal, net, moves };
}
const catOf = e => { const c = CATS.find(([, , re]) => re.test(e.title)); return c ? c[0] : "other"; };

    <div class="btns"><button class="btn orange big-btn" data-fund-new>＋ 記一筆公積金花費</button></div>
    <div class="fund-list">${list.length ? list.map(e => `<button class="exp exp-row" data-edit="${e.id}"><div><b>${esc(e.title)}</b> ${fmtAmt(e)}${!isTWD(e) ? ` <span class="muted">≈ ${fmtTWD(toTWD(e))}</span>` : ""}<br>
      <span class="muted">Day ${e.day + 1}・${mdw(DAYS[e.day])}・${allLabel(e.split.length)}</span></div><span>✏️</span></button>`).join("") : `<p class="muted" style="margin:8px 0 0">還沒有公積金花費紀錄</p>`}</div>
    <p class="muted" style="margin:8px 0 0">${TRIP.cur.name}以 1 : ${TRIP.cur.rate} 換算成台幣。</p></div>`;

  const paid = EXP.filter(e => e.payer === m).map(e => ({ e, v: toTWD(e) })).sort((a, b) => b.v - a.v);
  const shareT = mine.reduce((a, x) => a + x.v, 0), paidT = paid.reduce((a, x) => a + x.v, 0);

/* ---------- 🌦️ 天氣 ---------- */
const WX_CODE = {0:["☀️","晴朗"],1:["🌤️","大致晴朗"],2:["⛅","局部多雲"],3:["☁️","陰天"],45:["🌫️","有霧"],48:["🌫️","有霧"],
  51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌦️","毛毛雨"],61:["🌧️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],71:["🌨️","小雪"],73:["🌨️","下雪"],75:["❄️","大雪"],
  80:["🌦️","短暫陣雨"],81:["🌧️","陣雨"],82:["⛈️","豪大陣雨"],95:["⛈️","雷陣雨"],96:["⛈️","雷陣雨"],99:["⛈️","強烈雷雨"]};
let WX = store.get("wx", null);
async function loadWeather(){
  if (!WX_PLACES.length || (WX && Date.now() - WX.at < 3600000)) return;
  if (stamp(TRIP.start, "00:00") - (Date.now() + TRIP.utc * 3600000) > 15 * 86400000) return; // 預報只有 16 天內，太早問會被拒絕
  try {
    const q = new URLSearchParams({ latitude: WX_PLACES.map(p => p.lat).join(","), longitude: WX_PLACES.map(p => p.lon).join(","),
      daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max", timezone: TRIP.tzIana, start_date: TRIP.start, end_date: TRIP.end });
    const r = await fetch("https://api.open-meteo.com/v1/forecast?" + q); if (!r.ok) return;
    const data = [].concat(await r.json());
    WX = { at: Date.now(), days: data.map(loc => loc.daily.time.map((t, i) => ({ date: t, code: loc.daily.weather_code[i], max: loc.daily.temperature_2m_max[i], min: loc.daily.temperature_2m_min[i], rain: loc.daily.precipitation_probability_max[i] }))) };
    store.set("wx", WX); if (tab === "home" || tab === "plan") render();
  } catch(e){}
}
function wxOf(di){ if (!WX) return null; const w = WX.days[WX_DAY_PLACE[di] || 0]?.find(x => x.date === DAYS[di].date); return w && w.max != null ? w : null; }
function weatherHTML(di){
  const w = wxOf(di); if (!w) return "";
  const [ico, txt] = WX_CODE[w.code] || ["🌡️", "—"], tips = [];
  if (w.rain >= 60) tips.push("☔ 降雨機率高，記得帶傘或輕便雨衣"); else if (w.rain >= 30) tips.push("🌂 可能會下雨，包包放把摺疊傘");
  if (w.max >= 33) tips.push("🥵 很熱！多補水、做好防曬"); if (w.min <= 10) tips.push("🧥 早晚偏冷，記得帶外套");
  return `<div class="wx"><div class="wx-ico">${ico}</div><div class="wx-main"><div class="wx-place">🌦️ ${WX_PLACES[WX_DAY_PLACE[di] || 0].name}天氣預報</div>
    <div class="wx-txt">${txt}<span class="wx-t">${Math.round(w.min)}° – ${Math.round(w.max)}°C</span></div><div class="muted">💧 降雨機率 ${w.rain ?? "—"}%</div>
    ${tips.map(t => `<div class="wx-tip">${t}</div>`).join("")}<div class="wx-upd">越接近當天越準</div></div></div>`;
}
function weatherStrip(){
  if (!WX) return "";
  const cells = DAYS.map((d, i) => { const w = wxOf(i); if (!w) return ""; return `<div class="wxs"><b>D${i + 1}</b><span class="wxs-i">${(WX_CODE[w.code] || ["🌡️"])[0]}</span><span>${Math.round(w.max)}°</span><span class="muted">💧${w.rain ?? "—"}%</span></div>`; }).join("");
  return cells ? `<h2>🌦️ 旅途天氣預報</h2><div class="card"><div class="wx-strip">${cells}</div></div>` : "";
}

  e.target.closest(".check").classList.toggle("done", e.target.checked);
  const n = PACKING.filter((_, i) => done[i]).length;
  $("#pack-count").textContent = `已完成 ${n} / ${PACKING.length}（勾選只存在你自己的手機）`;
  $("#pack-bar").style.width = n / PACKING.length * 100 + "%";
});

/* ---------- 啟動 ---------- */
document.title = TRIP.title;
$("#top-title").textContent = TRIP.short;
$("#foot").innerHTML = `${esc(TRIP.tzNote)}<br>${esc(TRIP.footer || "")}${TRIP.admin ? `<br><a href="/admin.html">🧭 領隊後台</a>` : ""}${TRIP.credit?.text ? `<br><a href="${esc(TRIP.credit.url || "#")}" target="_blank" rel="noopener">${esc(TRIP.credit.text)}</a>` : ""}`;
if (DEMO) $("#demo-bar").hidden = false;
const qTheme = new URLSearchParams(location.search).get("theme");
setTheme(FONTS[qTheme] ? qTheme : THEME);
if ((SHOW_SWITCHER || new URLSearchParams(location.search).has("switcher")) && !new URLSearchParams(location.search).has("bare")){
  const bar = document.createElement("div"); bar.className = "switcher";
  bar.innerHTML = THEMES.map(([t, n]) => `<button data-t="${t}">${n}</button>`).join("");
  document.body.appendChild(bar); setTheme(document.documentElement.dataset.theme);
  document.body.style.paddingBottom = "140px";
}
render();
loadWeather(); setInterval(loadWeather, 3600000);
loadExpenses(); setInterval(loadExpenses, 60000);
loadPaid(); setInterval(loadPaid, 60000);
loadRecs();
setInterval(() => { if (tab === "home") render(); else { clock(); if (tab === "msg") loadMessages(); if (tab === "rec") loadRecs(); if (tab === "stay") loadRooms(); } }, 30000);
</script>
</body>
</html>
